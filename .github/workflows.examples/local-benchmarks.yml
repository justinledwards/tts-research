# Disabled example only.
# To enable later, copy this file into .github/workflows/ after the team agrees
# which benchmark thresholds should become hosted gates.

name: Local Benchmarks Example

on:
  workflow_dispatch:

jobs:
  bench-local:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise install
      - run: pnpm install --frozen-lockfile
      - run: mise run bench:local
