[tools]
go = "1.26.3"
node = "26.1.0"
python = "3.13.13"
uv = "0.11.13"

[tasks]
start = "bash ./scripts/mise-start.sh"
setup = "bash ./scripts/runtime-setup.sh setup"
"setup:supertonic" = "bash ./scripts/runtime-setup.sh setup-supertonic"
"setup:dramabox" = "bash ./scripts/runtime-setup.sh setup-dramabox"
"setup:voice-embed" = "bash ./scripts/runtime-setup.sh setup-voice-embed"
"setup:alignment" = "bash ./scripts/runtime-setup.sh setup-alignment"
doctor = "bash ./scripts/runtime-setup.sh doctor"
"audit:artifacts" = "bash ./scripts/runtime-setup.sh audit-artifacts"
"audit:secrets" = "bash ./scripts/runtime-setup.sh audit-secrets"
"clean:history-plan" = "bash ./scripts/runtime-setup.sh clean-history-plan"
"clean:history:rewrite" = "bash ./scripts/runtime-setup.sh clean-history-rewrite"
"validate:ir" = "node ./scripts/validate-content-ir.mjs"
"validate:local" = "pnpm validate:local"
"validate:local:e2e" = "pnpm validate:local:e2e"
"validate:local:release" = "pnpm validate:local:release"
"bench:local" = "pnpm bench:local"
"local:bloat" = "pnpm local:bloat"
"local:clean" = "pnpm local:clean"
