[project]
name = "tts-research-kokoro"
version = "0.1.0"
description = "Python runtime dependencies for optional local provider backends."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
book = [
  "pypdf>=6.4.0,<7",
]
kokoro = [
  "kokoro>=0.9.4,<0.10",
  "soundfile>=0.13.1,<0.14",
]
qwen = [
  "qwen-asr>=0.0.6,<0.1",
]
profile-analysis = [
  "omegaconf>=2.3,<3",
  "pyannote.audio>=4.0.4,<5",
  "soundfile>=0.13.1,<0.14",
]

[tool.uv]
package = false
