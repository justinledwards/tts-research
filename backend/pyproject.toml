[project]
name = "tts-research-kokoro"
version = "0.1.0"
description = "Python runtime dependencies for local Kokoro TTS synthesis."
requires-python = ">=3.13,<3.14"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "huggingface-hub>=0.34.0,<1",
  "kanade-tokenizer @ git+https://github.com/frothywater/kanade-tokenizer",
  "kokoro>=0.9.4,<0.10",
  "kokoro-onnx>=0.5.0,<0.6",
  "misaki[en,ja,zh]>=0.9.4,<0.10",
  "qwen-asr>=0.0.6,<0.1",
  "soundfile>=0.13.1,<0.14",
  "torchaudio>=2.11.0,<2.12",
]

[tool.uv]
package = false
